<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us | Creative Hub</title>
<style>
  :root{
    --black:#0D0D0D;
    --charcoal:#2C2C2C;
    --graphite:#5E5E5E;
    --stone:#D9D9D9;
    --mist:#F5F5F5;
    --white:#FFFFFF;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Inter','Helvetica Neue',Arial,sans-serif;
    background:var(--white);
    color:var(--black);
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:'Inter','Helvetica Neue',Arial,sans-serif;font-weight:700;letter-spacing:-0.03em;line-height:1.05;}
  a{color:inherit;text-decoration:none;}

  header{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 48px;
    background:rgba(255,255,255,.85);
    -webkit-backdrop-filter:blur(12px);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--stone);
  }
  .logo-wrap{display:flex;align-items:center;gap:10px;}
  .logo-wrap img{height:22px;width:auto;display:block;}
  .logo-wrap span{font-weight:700;font-size:14px;letter-spacing:.02em;}
  .back-link{font-size:14px;color:var(--charcoal);transition:opacity .2s;}
  .back-link:hover{opacity:.6;}

  main{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:150px 24px 100px;
  }
  .contact-wrap{
    max-width:560px;
    text-align:center;
  }
  .eyebrow{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--graphite);margin-bottom:24px;
    opacity:0;transform:translateY(10px);
    animation:reveal .8s var(--ease) .05s forwards;
  }
  h1{
    font-size:clamp(2.2rem,5vw,3.4rem);
    margin-bottom:12px;
    opacity:0;transform:translateY(16px);
    animation:reveal .9s var(--ease) .15s forwards;
  }
  .subhead{
    font-size:19px;
    color:var(--graphite);
    margin-bottom:56px;
    opacity:0;transform:translateY(14px);
    animation:reveal .9s var(--ease) .25s forwards;
  }

  .contact-methods{
    display:flex;
    flex-direction:column;
    gap:20px;
    margin-bottom:48px;
    opacity:0;transform:translateY(14px);
    animation:reveal .9s var(--ease) .38s forwards;
  }
  .contact-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding:20px;
    border:1px solid var(--stone);
    border-radius:12px;
    transition:border-color .25s var(--ease), transform .25s var(--ease);
  }
  .contact-row:hover{border-color:var(--charcoal);transform:translateY(-2px);}
  .contact-row .icon{
    width:22px;height:22px;flex-shrink:0;color:var(--black);
  }
  .contact-row .contact-text{text-align:left;}
  .contact-row .label{font-size:12px;color:var(--graphite);text-transform:uppercase;letter-spacing:.06em;}
  .contact-row .value{font-size:16px;font-weight:600;margin-top:2px;}

  .prompt{
    font-size:17px;
    color:var(--graphite);
    line-height:1.6;
    margin-bottom:32px;
    opacity:0;transform:translateY(14px);
    animation:reveal .9s var(--ease) .5s forwards;
  }

  .cta-btn{
    display:inline-block;
    background:var(--black);
    color:var(--white);
    padding:17px 34px;
    border-radius:100px;
    font-size:15px;
    font-weight:600;
    transition:transform .25s var(--ease);
    opacity:0;transform:translateY(14px);
    animation:reveal .9s var(--ease) .6s forwards;
  }
  .cta-btn:hover{transform:translateY(-2px);}

  @keyframes reveal{to{opacity:1;transform:translateY(0);}}

  footer{
    background:var(--black);color:var(--stone);
    padding:32px 48px;text-align:center;font-size:12px;
  }

  @media (max-width:640px){
    header{padding:16px 22px;}
    main{padding:120px 20px 80px;}
    .contact-row{padding:16px;}
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo-wrap">
    <img src="logo-black.png" alt="Creative Hub">
    <span>CREATIVE HUB</span>
  </a>
  <a href="index.html" class="back-link">← Back</a>
</header>

<main>
  <div class="contact-wrap">
    <div class="eyebrow">Contact Us</div>
    <h1 class="display">Let's create something great.</h1>
    <p class="subhead">Let's talk.</p>

    <div class="contact-methods">
      <a href="https://wa.me/+23431113847" target="_blank" rel="noopener" class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.85.5 3.58 1.37 5.07L2 22l5.06-1.33A9.94 9.94 0 0012 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm5.2 14.2c-.22.62-1.28 1.18-1.77 1.24-.45.06-1.02.08-1.65-.1-.38-.11-.86-.27-1.48-.53-2.6-1.12-4.3-3.74-4.43-3.92-.13-.18-1.06-1.41-1.06-2.69 0-1.28.67-1.9.9-2.16.24-.26.52-.32.7-.32.17 0 .35 0 .5.01.16.01.38-.06.6.46.22.53.75 1.83.82 1.96.06.13.11.28.02.46-.09.18-.13.29-.26.45-.13.15-.28.34-.4.46-.13.13-.27.27-.12.53.16.26.7 1.15 1.5 1.86 1.03.92 1.9 1.21 2.16 1.35.26.13.41.11.56-.07.16-.18.68-.79.86-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.26.13.44.2.5.31.06.11.06.65-.16 1.27z"/></svg>
        <div class="contact-text">
          <div class="label">WhatsApp</div>
          <div class="value">+2348131113847</div>
        </div>
      </a>
      <a href="mailto:creativehub699@gmail.com" class="contact-row">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="4" width="20" height="16" rx="2" stroke-linejoin="round"/><path d="M2 6l10 7 10-7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="contact-text">
          <div class="label">Email</div>
          <div class="value">creativehub699@gmail.com</div>
        </div>
      </a>
    </div>

    <p class="prompt">Have a project in mind or need creative support for your brand?</p>

    <a href="work.html" class="cta-btn">Let's work together →</a>
  </div>
</main>

<footer>
  Copyright &copy; 2026 Creative Hub. All rights reserved.
</footer>

</body>
</html>
